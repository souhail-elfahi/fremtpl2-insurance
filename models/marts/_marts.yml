version: 2

models:
  - name: mart_policy_claims
    description: >
      Une ligne par contrat, avec les montants de sinistres agrégés. Les sinistres
      orphelins (IDpol absent des contrats) en sont absents.
    columns:
      - name: IDpol
        description: Identifiant du contrat (clé primaire).
        data_tests:
          - unique
          - not_null
      - name: n_amount_lines
        description: Nombre de lignes de montant du contrat (0 si aucune).
      - name: total_amount
        description: >
          Somme brute des montants. 0 si ClaimNb = 0 ; NULL seulement pour un
          contrat sinistré sans montant.
      - name: total_amount_capped
        description: >
          Somme des montants, chacun écrêté au p99 de tous les montants.
          0 et NULL suivent la même règle que total_amount.
          SEUIL PROVISOIRE (V1), à revoir avant tout usage tarifaire.
      - name: has_amount
        description: Vrai si ClaimNb > 0 et au moins une ligne de montant.

  - name: mart_segments
    description: >
      Indicateurs par variable de segmentation et par modalité. Analyse à une
      variable : l'effet d'une variable n'est pas isolé de celui des autres.
    columns:
      - name: variable
        description: Variable de segmentation (nom de la colonne source).
      - name: modalite
        description: Valeur ou tranche de la variable.
        data_tests:
          - not_null
      - name: n_contrats
        description: Nombre de contrats.
      - name: exposition
        description: Somme de exposure_capped, en années.
      - name: n_sinistres
        description: Somme de ClaimNb.
      - name: frequence
        description: n_sinistres / exposition.
        data_tests:
          - strictly_positive
      - name: n_sinistres_chiffres
        description: Nombre de lignes de montant.
      - name: cout_moyen_observe
        description: Montant brut observé / n_sinistres_chiffres.
      - name: prime_pure
        description: >
          frequence x cout_moyen_observe. Suppose que les sinistres sans montant
          coûtent en moyenne autant que les autres sinistres du segment
          (hypothèse non démontrée).
      - name: relativite_frequence
        description: frequence du segment / fréquence du portefeuille.
      - name: faible_exposition
        description: Vrai si l'exposition est inférieure à 1 000 années.
